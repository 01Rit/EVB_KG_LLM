version: '3.8'

# 动力电池拆卸知识图谱推理系统 v1.5

services:
  frontend:
    build: ./frontend
    image: kg-frontend:1.5
    ports:
      - "3090:3000"
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      labels:
        version: "1.5"
    image: kg-backend:1.5
    ports:
      - "50060:8000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./.tiktoken_cache:/app/.tiktoken_cache:ro
    depends_on:
      - neo4j
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=88888888
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - OPENAI_API_KEY=sk-GNFFv3jfsoVCDDWCA15875E0De4140B99c3aF15a7400422b
      - OPENAI_BASE_URL=http://host.docker.internal:4567/v1
      - LLM_MODEL=deepseek-chat
      - TIKTOKEN_CACHE_DIR=/app/.tiktoken_cache
      - SERPER_API_KEY=${SERPER_API_KEY}
    networks:
      - app-network

  neo4j:
    image: neo4j:5.20
    ports:
      - "17474:7474"
      - "17687:7687"
    volumes:
      - neo4j_data:/data
    environment:
      - NEO4J_AUTH=neo4j/88888888
    networks:
      - app-network

volumes:
  neo4j_data:

networks:
  app-network:
    driver: bridge
